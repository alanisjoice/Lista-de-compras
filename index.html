<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Lista de Compras</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F6D7A">
</head>
<body>
    <!-- App Bar -->
    <header class="app-bar">
        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-user-circle"></i>
        </button>
        
        <div class="app-title-wrapper">
            <h1 class="app-title">
                <i class="fas fa-cart-shopping"></i>
                Minha Lista
            </h1>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Conectado</span>
            </div>
        </div>
        
        <div class="app-actions">
            <button class="action-btn" onclick="compartilharLista()" title="Compartilhar lista">
                <i class="fas fa-share-alt"></i>
            </button>
            <button class="action-btn" onclick="logout()" title="Sair">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <!-- Menu Lateral -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="user-avatar" id="userAvatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <h3 id="userName">Usuário</h3>
                <p id="userEmail">carregando...</p>
            </div>
        </div>
        
        <div class="menu-items">
            <button class="menu-item" onclick="mostrarCategorias()">
                <i class="fas fa-tags"></i>
                <span>Categorias</span>
            </button>
            <button class="menu-item" onclick="mostrarHistorico()">
                <i class="fas fa-history"></i>
                <span>Histórico</span>
            </button>
            <button class="menu-item" onclick="mostrarConfiguracoes()">
                <i class="fas fa-cog"></i>
                <span>Configurações</span>
            </button>
            <button class="menu-item" onclick="mostrarAjuda()">
                <i class="fas fa-question-circle"></i>
                <span>Ajuda</span>
            </button>
        </div>
        
        <div class="menu-footer">
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair da conta</span>
            </button>
        </div>
    </div>

    <!-- Overlay do Menu -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <!-- Resumo da Lista -->
        <div class="list-summary">
            <div class="summary-card">
                <div class="summary-icon">
                    <i class="fas fa-list-check"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Total de itens</span>
                    <span class="summary-value" id="totalItems">0</span>
                </div>
            </div>
            
            <div class="summary-card">
                <div class="summary-icon">
                    <i class="fas fa-circle-check"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Comprados</span>
                    <span class="summary-value" id="checkedItems">0</span>
                </div>
            </div>
            
            <div class="summary-card">
                <div class="summary-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Pendentes</span>
                    <span class="summary-value" id="pendingItems">0</span>
                </div>
            </div>
        </div>

        <!-- Filtros Rápidos -->
        <div class="filter-section">
            <button class="filter-btn active" onclick="filtrarLista('todos')">
                <i class="fas fa-list"></i>
                Todos
            </button>
            <button class="filter-btn" onclick="filtrarLista('pendentes')">
                <i class="fas fa-clock"></i>
                Pendentes
            </button>
            <button class="filter-btn" onclick="filtrarLista('comprados')">
                <i class="fas fa-check"></i>
                Comprados
            </button>
        </div>

        <!-- Lista de Compras -->
        <div class="list-container">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-cart-plus"></i>
                <h3>Sua lista está vazia</h3>
                <p>Adicione itens usando o campo abaixo</p>
            </div>
            
            <ul class="shopping-list" id="lista"></ul>
        </div>
    </main>

    <!-- Barra de Adicionar Item (Fixada no rodapé) -->
    <footer class="add-item-bar">
        <div class="add-item-container">
            <input 
                type="text" 
                id="item" 
                class="add-item-input" 
                placeholder="Adicionar novo item..."
                autocomplete="off"
            >
            <button class="add-item-btn" onclick="adicionarItem()">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        
        <!-- Sugestões rápidas -->
        <div class="quick-suggestions" id="quickSuggestions">
            <button class="suggestion-chip" onclick="adicionarSugestao('Pão')">
                <i class="fas fa-bread-slice"></i> Pão
            </button>
            <button class="suggestion-chip" onclick="adicionarSugestao('Leite')">
                <i class="fas fa-milk"></i> Leite
            </button>
            <button class="suggestion-chip" onclick="adicionarSugestao('Ovos')">
                <i class="fas fa-egg"></i> Ovos
            </button>
            <button class="suggestion-chip" onclick="adicionarSugestao('Arroz')">
                <i class="fas fa-wheat"></i> Arroz
            </button>
        </div>
    </footer>

    <!-- Toast de Notificação -->
    <div class="toast" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">Mensagem</span>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        // Configuração global
        window.supabase = supabase;
        
        // Estado da aplicação
        let listaAtual = [];
        let filtroAtual = 'todos';
        let usuarioAtual = null;

        // Inicialização
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarUsuario();
            await carregarLista();
            configurarRealtime();
            configurarServiceWorker();
        });

        // Carregar dados do usuário
        async function carregarUsuario() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    usuarioAtual = user;
                    document.getElementById('userEmail').textContent = user.email;
                    document.getElementById('userName').textContent = user.email.split('@')[0];
                    
                    // Avatar com iniciais
                    const avatar = document.getElementById('userAvatar');
                    const initials = user.email.substring(0, 2).toUpperCase();
                    avatar.innerHTML = `<span class="avatar-text">${initials}</span>`;
                }
            } catch (error) {
                console.error('Erro ao carregar usuário:', error);
            }
        }

        // Carregar lista do Supabase
        async function carregarLista() {
            try {
                const { data, error } = await supabase
                    .from('items')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) throw error;
                
                listaAtual = data || [];
                renderizarLista();
                atualizarResumo();
            } catch (error) {
                console.error('Erro ao carregar lista:', error);
                mostrarToast('Erro ao carregar lista', 'error');
            }
        }

        // Configurar Realtime
        function configurarRealtime() {
            supabase
                .channel('items-changes')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'items' },
                    () => carregarLista()
                )
                .subscribe();
        }

        // Renderizar lista
        function renderizarLista() {
            const listaElement = document.getElementById('lista');
            const emptyState = document.getElementById('emptyState');
            
            let itensFiltrados = listaAtual;
            
            if (filtroAtual === 'pendentes') {
                itensFiltrados = listaAtual.filter(item => !item.comprado);
            } else if (filtroAtual === 'comprados') {
                itensFiltrados = listaAtual.filter(item => item.comprado);
            }
            
            if (itensFiltrados.length === 0) {
                listaElement.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            listaElement.style.display = 'block';
            emptyState.style.display = 'none';
            
            listaElement.innerHTML = itensFiltrados.map(item => `
                <li class="list-item ${item.comprado ? 'checked' : ''}" data-id="${item.id}">
                    <button class="item-checkbox" onclick="toggleItem('${item.id}')">
                        <i class="fas ${item.comprado ? 'fa-check-circle' : 'fa-circle'}"></i>
                    </button>
                    
                    <span class="item-text">${item.nome}</span>
                    
                    <div class="item-actions">
                        <button class="item-action-btn" onclick="editarItem('${item.id}')" title="Editar">
                            <i class="fas fa-pen"></i>
                        </button>
                        <button class="item-action-btn delete" onclick="removerItem('${item.id}')" title="Remover">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </li>
            `).join('');
        }

        // Atualizar resumo
        function atualizarResumo() {
            const total = listaAtual.length;
            const comprados = listaAtual.filter(item => item.comprado).length;
            const pendentes = total - comprados;
            
            document.getElementById('totalItems').textContent = total;
            document.getElementById('checkedItems').textContent = comprados;
            document.getElementById('pendingItems').textContent = pendentes;
        }

        // Adicionar item
        window.adicionarItem = async function() {
            const input = document.getElementById('item');
            const nome = input.value.trim();
            
            if (!nome) {
                mostrarToast('Digite um item para adicionar', 'warning');
                return;
            }
            
            try {
                const { error } = await supabase
                    .from('items')
                    .insert([{ 
                        nome: nome, 
                        comprado: false,
                        user_id: usuarioAtual?.id 
                    }]);
                
                if (error) throw error;
                
                input.value = '';
                mostrarToast('Item adicionado com sucesso!', 'success');
                
            } catch (error) {
                console.error('Erro ao adicionar:', error);
                mostrarToast('Erro ao adicionar item', 'error');
            }
        };

        // Toggle item
        window.toggleItem = async function(id) {
            const item = listaAtual.find(i => i.id === id);
            if (!item) return;
            
            try {
                const { error } = await supabase
                    .from('items')
                    .update({ comprado: !item.comprado })
                    .eq('id', id);
                
                if (error) throw error;
                
            } catch (error) {
                console.error('Erro ao atualizar:', error);
                mostrarToast('Erro ao atualizar item', 'error');
            }
        };

        // Remover item
        window.removerItem = async function(id) {
            if (!confirm('Deseja remover este item?')) return;
            
            try {
                const { error } = await supabase
                    .from('items')
                    .delete()
                    .eq('id', id
